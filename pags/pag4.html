        <label>Apellido:</label>

        <select id="danza">

            <option>Caporales</option>
            <option>Diablada</option>
            <option>Tinku</option>

        <label>Comentario:</label>
        <textarea id="comentario"></textarea>

        <br>

        <button type="button" onclick="validarFormulario()">
            Enviar
        </button>

    </form>
